name: Weekly agent

# Picks the top open item in AGENT_TODO.md, implements it on an agent/* branch,
# runs `make check`, and opens a PR. It never merges; CI reviews the PR and
# automerge.yml merges it only if it is green and avoids the guarded paths.
# Needs: the CLAUDE_CODE_OAUTH_TOKEN secret and the Claude GitHub App installed
# on this repository (PRs opened by the app trigger CI; GITHUB_TOKEN ones do not).

on:
  schedule:
    - cron: "0 7 * * 1"   # Mondays 07:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: weekly-agent
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/requirements.txt
      - name: Install TeX and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended lmodern latexmk
          python -m pip install -r code/requirements.txt
      - name: Run the agent
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--max-turns 80 --allowedTools Bash,Read,Write,Edit,Grep,Glob'
          prompt: |
            Read docs/AGENT_MISSION.md first and follow it exactly.

            1. Pick the FIRST unchecked item in AGENT_TODO.md that you can finish
               without accounts, keys, or a decision reserved for the authors.
               If none qualifies, stop: doing nothing is a valid outcome.
            2. Create branch agent/<short-slug>. Implement the item minimally.
               If it changes a number, change the code that writes the macro, never
               the number in the .tex. If it adds a mathematical claim, add an assert
               to code/verify_corrections.py that would fail if the claim were false,
               and check the assert fails when you break the claim on purpose.
            3. Tick the item in AGENT_TODO.md as `**Done YYYY-MM-DD**: <what shipped>`.
               Anything that needs a human goes to the end of HUMAN_TODO.md (append only).
            4. Run `make check PY=python`. Never open a PR that is red.
               Commit messages and the PR body must not contain a Co-Authored-By
               trailer or a "Generated with Claude Code" line (invariant 8).
            Never edit the constitution listed in docs/AGENT_MISSION.md (CI fails
            such a PR), and never remove an assert from the assertion scripts.
            5. Commit, push the branch, and run
               `gh pr create --assignee diomavro --title "<plain one-line summary>" --body "<what changed, why, how validated>\n\nOpened by the weekly agent; auto-merges on green CI."`
               Do not merge.
